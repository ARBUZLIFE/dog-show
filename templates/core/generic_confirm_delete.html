{% extends 'base.html' %}

{% block title %}Удаление - Выставка собак{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h2 class="card-title text-danger mb-3">
                    <i class="bi bi-exclamation-triangle"></i> Удаление
                </h2>

                <p class="fs-5">
                    Удалить <strong>«{{ object }}»</strong>?
                </p>
                {% if delete_warning %}
                    <p class="text-danger">{{ delete_warning }}</p>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Да, удалить
                        </button>
                        <a href="{% url cancel_url %}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
