{% extends 'base.html' %}

{% block title %}{{ action_title }} - Выставка собак{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-warning">
            <div class="card-body p-4">
                <h2 class="card-title mb-3">
                    <i class="bi bi-question-circle"></i> {{ action_title }}
                </h2>

                <p class="fs-5">
                    Подтвердите действие для <strong>{{ object }}</strong>.
                </p>

                {% if action_warning %}
                    <p class="text-warning">{{ action_warning }}</p>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Подтвердить
                        </button>
                        <a href="{{ cancel_url }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
